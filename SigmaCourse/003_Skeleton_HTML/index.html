<!DOCTYPE html>
<!-- Declares the document type and HTML version (HTML5) -->

<html lang="en">
<!-- Root element of the webpage. The 'lang' attribute specifies the page language. -->

<head>
    <!-- Contains metadata and resources that are not displayed on the webpage. -->

    <meta charset="UTF-8">
    <!-- Sets the character encoding to UTF-8, supporting most languages and symbols. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the webpage responsive on different screen sizes. -->

    <title>Skeleton of HTML</title>
    <!-- The title displayed in the browser tab. -->

    <link rel="stylesheet" href="style.css">
    <!-- Links the external CSS file for styling. -->
</head>

<body>
    <!-- Contains all the visible content of the webpage. -->

    <header>
        <!-- Represents the introductory section of the page or a section. -->
        <h1>Welcome to the Void</h1>
    </header>

    <nav>
        <!-- Contains navigation links for the website. -->
    </nav>

    <main>
        <!-- Holds the primary content unique to this page. -->

        <section>
            <!-- Groups related content together. -->
            <h2>Section Title</h2>
            <p>This is a sample paragraph inside a section.</p>
        </section>

        <article>
            <!-- Represents self-contained content such as a blog post or news article. -->
            <h2>Article Title</h2>
            <p>This is an example article.</p>
        </article>

        <aside>
            <!-- Contains supplementary content like sidebars, tips, or advertisements. -->
            <p>Additional information goes here.</p>
        </aside>
    </main>

    <footer>
        <!-- Represents the footer of the page or a section. -->
        <p>&copy; 2026 My Website</p>
    </footer>

    <script src="script.js"></script>
    <!-- Links the external JavaScript file. Placed before the closing body tag for better page loading performance. -->
</body>

</html>
