<!-- 
QUIZ: without using <br> tag, write a vertically aligned form asking user for name, city and pincode 
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Quiz.css">
  <title>Document</title>
</head>

<body>

  <form action="post">

    <div>
      <label for="name">Name: </label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
    </div>

    <div>
      <label for="city">Enter City: </label>
      <input type="text" id="city" name="city" placeholder="Enter your city" required>
    </div>

    <div>
      <label for="pincode">PINCODE: </label>
      <input type="text" id="pincode" name="pincode" placeholder="Enter your PINCODE" pattern="[0-9]{6}" inputmode="numeric" required>
    </div>

  </form>

</body>

</html>
