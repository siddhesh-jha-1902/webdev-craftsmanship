<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ID and Classes in HTML</title>
</head>
<body>
  
  <div id="firstDiv" class="red bg-yellow">First</div> 
  <!-- Classes can be multiple for an element... and are seperated by a space. example: red bg-yellow => red and bg-yellow are two different classes -->
  <!-- IDs are unique; only one per element. An element cannot have multiple IDs -->

  <!-- IDs have higher precedence in styling matter than Classes -->
  <!-- IDs can be used for linking the whole page and targets the specific element w.r.t. the ID -->

  <div id="secondDiv">Second</div>
  <span class="red"></span>

</body>
</html>
